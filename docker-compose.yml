version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Kunci autentikasi admin & API (dibaca dari .env atau environment host, dikosongkan berarti dibuat otomatis)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # URL dasar publik layanan, mis. https://your-domain.com (dikosongkan berarti frontend admin mendeteksi domain saat ini secara otomatis)
      - MUSE2API_PUBLIC_BASE=
      # Konfigurasi timeout (detik)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Persistensi konfigurasi akun, log tugas & file media
      - ./data:/app/data
    shm_size: '2gb' # Pastikan Chromium saat me-render banyak tab tidak crash karena /dev/shm habis
